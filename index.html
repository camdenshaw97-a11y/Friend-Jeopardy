<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1f9c">
<title>Join the game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a1f9c'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Impact,Arial Narrow,sans-serif' font-size='40' fill='%23f5c542'%3E$%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--text); background: var(--navy); color: #fff; touch-action: manipulation; overscroll-behavior: none; }
  button { font-family: inherit; cursor: pointer; }
  .view { display: none; min-height: 100%; }
  .view.on { display: block; animation: viewIn .32s ease-out; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } }
  @keyframes riseIn { from { opacity: 0; transform: translateY(12px); } }
  @keyframes popIn { from { opacity: 0; transform: scale(.6); } }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes fadeOut { to { opacity: 0; } }
  .disp { font-family: var(--display); font-weight: 400; text-transform: uppercase; letter-spacing: .03em; }

  /* ------------------------------------------------------------ join */
  #join { position: relative; overflow: hidden; min-height: 100%; background: radial-gradient(ellipse 140% 70% at 50% 110%, #0b1cc0 0%, #060d7a 35%, #03063a 70%, #010314 100%); }
  #join.on { display: flex; flex-direction: column; }
  #join::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(100deg, transparent 20%, #3b55ff1c 32%, transparent 42%); }
  .j-wrap { position: relative; flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 440px; margin: 0 auto; padding: 36px 20px calc(28px + env(safe-area-inset-bottom)); }
  .j-logo { align-self: center; display: flex; align-items: center; justify-content: center; max-width: 100%; padding: 16px 36px 12px; margin-bottom: 32px; border-radius: 4px; background: linear-gradient(#2038e8, #0a16b8 55%, #070f80); box-shadow: 0 0 0 3px #000, 0 0 0 5px #6b7fff, 0 0 46px #2a44ff66, inset 0 -10px 24px #0007; animation: logoIn .6s cubic-bezier(.3, 1.35, .5, 1) backwards; }
  @keyframes logoIn { from { opacity: 0; transform: scale(.6); } }
  .j-logo b { font: 400 min(44px, 10vw)/1 var(--display); letter-spacing: .06em; white-space: nowrap; transform: skewX(-7deg); display: inline-block; text-shadow: 3px 3px 0 #000, 0 0 18px #5f74ff88; }
  .j-card { background: linear-gradient(#1226c8, #0a16a0 55%, #070f78); border-radius: 6px; padding: 20px 18px 22px; box-shadow: 0 0 0 3px #000, 0 0 0 4px #4a5fe0, 0 18px 40px #000a, inset 0 0 30px #0007; animation: riseIn .45s cubic-bezier(.2, .9, .3, 1) .1s backwards; }
  .j-card label { display: flex; justify-content: space-between; align-items: baseline; margin: 0 4px 8px; font: 400 19px var(--display); letter-spacing: .07em; color: var(--gold); }
  .j-card label:not(:first-child) { margin-top: 18px; }
  .j-card label span:last-child { font: 700 13px var(--text); letter-spacing: 0; color: #9fb0ee; }
  .j-card input { display: block; width: 100%; border: 2px solid #000; border-radius: 6px; background: #030a36; color: #fff; padding: 13px 14px; font: 800 22px var(--text); text-transform: uppercase; box-shadow: inset 0 3px 8px #0009; transition: border-color .18s, box-shadow .18s; }
  .j-card input::placeholder { color: #5266b8; font-weight: 700; text-transform: none; }
  .j-card input:focus { outline: none; border-color: var(--gold); box-shadow: inset 0 3px 8px #0009, 0 0 0 4px #f7c94840; }
  .j-card #code { text-align: center; font: 400 44px/1.1 var(--display); letter-spacing: .32em; padding: 13px 0 8px .32em; }
  .j-card #code::placeholder { color: #33479c; font-weight: 400; }
  .j-play { position: relative; isolation: isolate; overflow: hidden; display: flex; align-items: center; justify-content: center; width: 100%; margin-top: 22px; border: 0; border-radius: 6px; padding: 17px 16px 13px; font: 400 30px/1 var(--display); letter-spacing: .08em; --d: #0a1445; color: #8094e0; background: linear-gradient(#22348f, #17246b); box-shadow: 0 7px 0 var(--d); transition: transform .09s ease-out, box-shadow .12s ease-out, color .25s; }
  .j-play::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(#ffe27a, #f2b01e); opacity: 0; transition: opacity .25s; }
  .j-play.ready { --d: #8a5200; color: #231700; box-shadow: 0 7px 0 var(--d), 0 14px 26px #0008; }
  .j-play.ready::before { opacity: 1; }
  .j-play:active, .j-play[data-fx-press] { transform: translateY(5px); box-shadow: 0 2px 0 var(--d); }
  .j-play.busy { pointer-events: none; }
  .j-play.busy::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(100deg, transparent 30%, #ffffff66 50%, transparent 70%); animation: sheen 1.1s linear infinite; }
  @keyframes sheen { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  #joinWait { color: #cfdcff; font-weight: 700; font-size: 14px; line-height: 1.35; text-align: center; margin: 14px 0 0; animation: fadeIn .3s; }
  #joinWait:empty { display: none; }
  #joinErr { color: #ffb4ae; font-weight: 700; font-size: 14px; line-height: 1.35; text-align: center; margin: 14px 0 0; }
  #joinErr:empty { display: none; }
  .fine { text-align: center; font-weight: 600; font-size: 14px; color: #b9c6f5; margin: 22px 0 0; line-height: 1.5; }
  .fine a { color: var(--gold); }
  .ver { margin: auto 0 0; padding-top: 18px; text-align: center; font-weight: 700; font-size: 12px; letter-spacing: .06em; color: #6f80c8; }
  #deskTv { display: none; text-align: center; margin-bottom: 24px; }
  #deskTv p { font-weight: 700; font-size: 16px; margin: 0 0 12px; color: #dfe7ff; }
  .tvbtn { display: flex; align-items: center; justify-content: center; text-decoration: none; border-radius: 16px; padding: 19px 16px 15px; font: 400 26px/1.1 var(--display); letter-spacing: .05em; color: #fff; background: linear-gradient(#3f7ff2, #1b46c2); box-shadow: 0 7px 0 #061462, 0 14px 26px #0008; transition: transform .09s ease-out, box-shadow .12s ease-out, filter .15s; }
  .tvbtn:active, .tvbtn[data-fx-press] { transform: translateY(5px); box-shadow: 0 2px 0 #061462; }
  #deskTv span { display: flex; align-items: center; gap: 12px; margin-top: 28px; font: 400 15px var(--display); letter-spacing: .12em; color: #9fb0ee; }
  #deskTv span::before, #deskTv span::after { content: ""; flex: 1; height: 2px; background: #ffffff2e; }
  @media (min-width: 900px) and (hover: hover) and (pointer: fine) { #join:not(.hascode) #deskTv { display: block; } #join:not(.hascode) .tvhint { display: none; } }

  /* --------------------------------------------------------- shared */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; background: #030726; font-weight: 700; font-size: 14px; color: #b9c6f5; }
  .bar b { color: #fff; font: 400 20px var(--display); letter-spacing: .12em; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 14px 14px 40px; }
  h2.t { font: 400 26px var(--display); letter-spacing: .04em; margin: 10px 0 12px; text-align: center; color: var(--gold); animation: riseIn .3s ease-out; }
  .card { background: #0a1480; border-radius: 6px; padding: 14px; margin-bottom: 12px; box-shadow: 0 0 0 2px #000, inset 0 0 0 1px #4a5fe066; transition: box-shadow .25s; animation: riseIn .36s cubic-bezier(.2, .9, .3, 1) backwards; }
  .card.mine { box-shadow: 0 0 0 2px #000, inset 0 0 0 2px var(--gold); }
  .card h3 { font: 400 24px var(--display); letter-spacing: .04em; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card h3 small { font: 700 12px var(--text); color: #9fb0ee; letter-spacing: .06em; }
  .who { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; min-height: 30px; }
  .who span { background: #1b2b80; border-radius: 999px; padding: 5px 11px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; transition: opacity .25s; animation: popIn .34s cubic-bezier(.3, 1.5, .5, 1) backwards; }
  .who span.me { background: var(--gold); color: #1c1400; }
  .who span.off { opacity: .45; }
  .who span i { font-style: normal; color: #86adff; font-size: 12px; }
  .who em { color: #9fb0ee; font-style: normal; font-size: 14px; padding: 5px 0; }
  .who button { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%; background: #00000040; color: #fff; font: 800 12px/1 var(--text); }
  .btn { --d: #101f73; display: flex; align-items: center; justify-content: center; gap: .45em; width: 100%; border: 0; border-radius: 6px; padding: 14px; font: 800 17px var(--text); color: #fff; background: #2a45c9; box-shadow: 0 4px 0 var(--d); transition: transform .09s ease-out, box-shadow .09s ease-out, background-color .2s, color .2s, opacity .25s, filter .2s; }
  .btn:active:not(:disabled), .btn[data-fx-press]:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--d); }
  .btn.gold { --d: #8a5200; background: linear-gradient(#ffe27a, #f2b01e); color: #231700; }
  .btn.green { --d: #0c5c3c; background: linear-gradient(#4fe3a8, #22a66f); color: #06301f; }
  .btn.red { --d: #6d0906; background: linear-gradient(#f0463d, #c41410); }
  .btn.ghost { background: transparent; box-shadow: inset 0 0 0 2px #3a4da8; color: #cfdcff; }
  .btn.ghost:active:not(:disabled), .btn.ghost[data-fx-press]:not(:disabled) { transform: scale(.96); background: #ffffff1a; }
  .btn.big { padding: 20px; font-size: 22px; }
  .btn.sm { padding: 10px; font-size: 14px; }
  .btn:disabled { opacity: .4; }
  .btn.gold.glow { animation: glow 1.8s ease-in-out .3s 2; }
  @keyframes glow { 50% { filter: brightness(1.12); box-shadow: 0 4px 0 var(--d), 0 0 26px #ffd24acc; } }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .note { color: #b9c6f5; font-size: 14px; line-height: 1.45; text-align: center; margin: 10px 4px; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 2px; font-weight: 700; font-size: 15px; }
  .toggle small { display: block; font-weight: 400; color: #9fb0ee; font-size: 13px; margin-top: 2px; }
  .sw { flex: none; width: 54px; height: 32px; border-radius: 999px; background: #2b3a80; border: 0; position: relative; transition: background-color .24s, opacity .25s; }
  .sw::after { content: ""; position: absolute; left: 4px; top: 4px; width: 24px; height: 24px; border-radius: 12px; background: #fff; box-shadow: 0 1px 3px #0007; transition: transform .28s cubic-bezier(.3, 1.45, .5, 1); }
  .sw.on { background: #31c48d; }
  .sw.on::after { transform: translateX(22px); }
  .sw:disabled { opacity: .45; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; border: 0; border-radius: 10px; padding: 10px 0; font: 800 14px var(--text); color: #cfdcff; background: #1b2b80; transition: background-color .2s, color .2s, transform .1s; }
  .seg button.on { background: var(--gold); color: #231700; }
  .seg button:active, .seg button[data-fx-press] { transform: scale(.94); }
  a.link { display: block; text-align: center; color: #9fb0ee; font-size: 14px; font-weight: 700; margin-top: 16px; text-decoration: underline; }
  .tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 6px; background: #e0211b; color: #fff; font-size: 11px; line-height: 18px; vertical-align: middle; }
  .tag.gold { background: var(--gold); color: #231700; }
  select, input.num { width: 100%; font: 700 18px var(--text); color: #fff; background: #060f45; border: 2px solid #3a4da8; border-radius: 10px; padding: 11px 12px; margin: 4px 0 10px; }
  input.num:focus, input.txt:focus { outline: none; border-color: var(--gold); }
  input.txt { width: 100%; font: 700 18px var(--text); color: #fff; background: #060f45; border: 2px solid #3a4da8; border-radius: 10px; padding: 12px; margin: 4px 0 10px; }

  /* ------------------------------------------------------- scoreline */
  .scores { display: flex; gap: 6px; padding: 8px 10px; background: #030726; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .scores .sc { flex: 1 0 auto; min-width: 72px; background: linear-gradient(#1a2ee6, #060ce9 45%, #050ab4); border-radius: 3px; padding: 5px 8px 4px; text-align: center; box-shadow: 0 0 0 2px #000; transition: box-shadow .3s; }
  .scores .sc.me { box-shadow: 0 0 0 2px #000, inset 0 0 0 2px var(--gold); }
  .scores .sc.ctl .n::after { content: " ★"; color: var(--gold); }
  .scores .sc.buzz { background: #1d3fd0; box-shadow: inset 0 0 0 2px #fff; }
  .scores .sc .n { font-size: 10px; font-weight: 800; letter-spacing: .05em; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }
  .scores .sc .s { font: 400 22px/1.05 var(--display); display: block; white-space: nowrap; text-shadow: 2px 2px 0 #000; }
  .scores .sc .s.neg { color: #ff6a60; }

  /* ------------------------------------------------------------ play */
  #play.on { display: flex; flex-direction: column; height: var(--vh, 100dvh); min-height: 0; overflow: hidden; }
  #pStatus { padding: 9px 12px; text-align: center; font-weight: 800; font-size: 15px; line-height: 1.3; background: #0a1480; transition: background-color .3s, color .3s; }
  #pStatus.you { background: var(--gold); color: #231700; }
  #pStatus.hot { background: #e0211b; color: #fff; }
  #pMain { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
  .me-score { text-align: center; padding: 6px 0 2px; }
  .me-score b { display: block; font: 400 44px/1 var(--display); color: #fff; text-shadow: 3px 3px 0 #000; }
  .me-score b.neg { color: #ff6a60; }
  .me-score small { display: block; font: 800 12px var(--text); letter-spacing: .1em; color: #9fb0ee; }
  .pbuzz { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 240px; }
  #buzzBtn { width: 230px; height: 230px; border-radius: 50%; border: 0; color: #fff; font: 400 48px var(--display); letter-spacing: .06em; background: radial-gradient(circle at 50% 32%, #ff6a60, #e0211b 55%, #9c0d08); box-shadow: 0 12px 0 #5c0603, 0 0 0 8px #2a0301, 0 22px 40px #000a, inset 0 -10px 24px #0005, inset 0 10px 20px #ffffff44; user-select: none; -webkit-user-select: none; touch-action: none; position: relative; transition: transform .07s ease-out, box-shadow .07s ease-out, filter .3s, font-size .2s; }
  #buzzBtn::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 6px solid #ff8a80; opacity: 0; pointer-events: none; }
  #buzzBtn.ring::after { animation: ring .5s ease-out; }
  @keyframes ring { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(1.55); } }
  #buzzBtn.live { animation: pulse 1s ease-in-out infinite; }
  #buzzBtn:active, #buzzBtn.down { transform: translateY(8px); box-shadow: 0 4px 0 #5c0603, 0 0 0 8px #2a0301, inset 0 -10px 24px #0005; animation: none; }
  #buzzBtn.wait { filter: grayscale(.6) brightness(.75); font-size: 30px; }
  #buzzBtn.locked { filter: grayscale(1) brightness(.5); font-size: 26px; }
  @keyframes pulse { 50% { box-shadow: 0 12px 0 #5c0603, 0 0 0 8px #2a0301, 0 0 0 20px #e0211b44, 0 22px 40px #000a, inset 0 -10px 24px #0005, inset 0 10px 20px #ffffff44; } }
  .pnote { font-weight: 700; font-size: 15px; color: #dfe7ff; text-align: center; margin: 0; padding: 0 16px; line-height: 1.35; }
  .clue { background: #fff; color: #111; border-radius: 6px; padding: 12px 14px; animation: riseIn .34s cubic-bezier(.2, .9, .3, 1) backwards; }
  .clue small { display: block; font-weight: 800; font-size: 11px; letter-spacing: .08em; color: #2a45c9; margin-bottom: 4px; }
  .clue b { font: 700 18px/1.3 var(--serif); }
  .clue .resp { margin-top: 8px; padding-top: 8px; border-top: 2px solid #e4e8ff; font: 800 16px var(--text); color: #0a1f9c; }
  .clue .resp small { color: #8a5200; }
  /* the board on a phone: categories down the page, values across */
  .pboard { display: grid; gap: 6px; }
  .pcat { display: grid; grid-template-columns: 1fr; gap: 4px; background: #000; border-radius: 3px; padding: 4px; }
  .pcat h4 { margin: 0; padding: 7px 4px 5px; font: 400 15px/1.15 var(--display); letter-spacing: .05em; color: #fff; text-align: center; min-height: 18px; background: linear-gradient(#1a2ee6, #060ce9 45%, #050ab4); border-radius: 2px; text-shadow: 2px 2px 0 #000; }
  .pcat .vals { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .pcat .vals button { border: 0; border-radius: 2px; padding: 11px 0 9px; font: 400 18px/1 var(--display); color: var(--gold); text-shadow: 1px 1px 0 #8a6200, 2px 2px 0 #000; background: linear-gradient(#1a2ee6, #060ce9 45%, #050ab4); transition: transform .09s ease-out, opacity .2s, filter .1s; }
  .pcat .vals button:active:not(:disabled), .pcat .vals button[data-fx-press]:not(:disabled) { transform: scale(.94); filter: brightness(1.3); }
  .pcat .vals button:disabled { opacity: .3; color: transparent; text-shadow: none; }
  .pcat .vals button.dd { box-shadow: inset 0 0 0 2px var(--gold); }     /* host only */
  .pboard.ro .pcat .vals button { pointer-events: none; }
  .wager { display: grid; gap: 8px; }
  .wager .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .wager .quick button { border: 0; border-radius: 10px; padding: 10px 0; font: 800 14px var(--text); color: #cfdcff; background: #1b2b80; }
  .wager .quick button:active, .wager .quick button[data-fx-press] { background: #2a45c9; color: #fff; }
  .lockwrap { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 18px; border-radius: 6px; background: #061062; font-weight: 800; color: #31c48d; }
  .clockrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .clock { font: 400 56px/1 var(--display); color: var(--gold); transition: color .3s; }
  .clock.hot { color: #ff6a60; }
  .frow { display: flex; align-items: center; gap: 10px; background: #061062; border-radius: 4px; padding: 10px 12px; }
  .frow > span { flex: 1; min-width: 0; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frow small { display: block; font-weight: 600; color: #9fb0ee; font-size: 12px; }
  .frow em { font-style: normal; font: 400 18px var(--display); color: var(--gold); }
  .frow em.neg { color: #ff6a60; }
  .frow .st { font: 800 11px var(--text); letter-spacing: .06em; padding: 4px 8px; border-radius: 999px; background: #1b2b80; color: #cfdcff; }
  .frow .st.ok { background: #31c48d; color: #06301f; }
  .frow.cur { box-shadow: inset 0 0 0 2px var(--gold); }
  .frow.right { box-shadow: inset 0 0 0 2px #31c48d; }
  .frow.wrong { box-shadow: inset 0 0 0 2px var(--red); }
  .frow.sit { opacity: .5; }
  .frow input { width: 100px; margin: 0; padding: 8px; font-size: 15px; }
  .st-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .st-grid div { background: linear-gradient(#1a2ee6, #060ce9 45%, #050ab4); border-radius: 3px; padding: 9px 4px 7px; text-align: center; box-shadow: 0 0 0 2px #000; }
  .st-grid b { display: block; font: 400 26px/1.05 var(--display); }
  .st-grid small { display: block; margin-top: 3px; font-weight: 800; font-size: 10px; letter-spacing: .06em; color: #9fb0ee; }
  .st-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
  .st-head b { font: 400 20px var(--display); letter-spacing: .06em; color: var(--gold); }
  .st-head span { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; }
  .st-head i { font: 800 10px/1 var(--text); font-style: normal; letter-spacing: .06em; padding: 5px 8px 4px; border-radius: 999px; color: #231700; background: var(--gold); }
  .st-head i.miss { color: #fff; background: var(--red); }
  .ranks div { display: flex; justify-content: space-between; padding: 6px 2px; border-bottom: 1px solid #ffffff14; font-weight: 700; }
  .ranks div b { font: 400 18px var(--display); color: var(--gold); }

  /* ------------------------------------------------------------ host */
  #host.on { display: flex; flex-direction: column; height: var(--vh, 100dvh); min-height: 0; overflow: hidden; }
  #host .wrap { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); overflow-y: auto; }
  #host .wrap > * { flex: none; margin: 0; }
  .prompt { background: #0a1480; border-radius: 6px; padding: 12px 14px; box-shadow: 0 0 0 2px #000, inset 0 0 0 2px var(--gold); animation: promptIn .3s cubic-bezier(.2, .9, .3, 1) backwards; }
  @keyframes promptIn { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  .prompt p { margin: 0 0 10px; font-size: 15px; line-height: 1.4; }
  .prompt p:last-child { margin-bottom: 0; }
  .prompt p b { color: var(--gold); }
  .prompt .row { margin-top: 10px; }
  .hfoot { display: flex; gap: 10px; margin-top: 4px; }
  .hfoot .btn { flex: 1; }
  .lights { display: flex; gap: 6px; justify-content: center; margin: 8px 0 4px; }
  .lights i { width: 40px; height: 10px; border-radius: 5px; background: #ffffff33; transition: background-color .15s; }
  .lights i.lit { background: #fff; box-shadow: 0 0 10px #fff; }
  .menu-back { position: fixed; inset: 0; background: #010314f7; z-index: 500; overflow: auto; animation: sheetIn .3s cubic-bezier(.2, .9, .3, 1); }
  .menu-back.out { animation: sheetOut .2s ease-in forwards; pointer-events: none; }
  @keyframes sheetIn { from { opacity: 0; transform: translateY(36px); } }
  @keyframes sheetOut { to { opacity: 0; transform: translateY(36px); } }
  .menu { max-width: 520px; margin: 0 auto; padding: 16px 14px 40px; }
  .adj { display: flex; align-items: center; gap: 6px; margin: 8px 0; }
  .adj span { flex: 1; font-weight: 800; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .adj b { font: 400 20px var(--display); width: 86px; text-align: center; }
  .adj button { display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 8px; width: 46px; height: 38px; font: 800 12px/1 var(--text); background: #2a45c9; color: #fff; }
  .adj button:active, .adj button[data-fx-press] { filter: brightness(1.25); }

  /* -------------------------------------------------------- overlays */
  #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: #fff; color: #111; font-weight: 800; font-size: 15px; padding: 10px 18px; border-radius: 999px; z-index: 900; display: none; width: max-content; max-width: 90vw; text-align: center; box-shadow: 0 8px 30px #000a; }
  #toast.on { display: block; animation: toastIn .3s cubic-bezier(.3, 1.4, .5, 1); }
  #toast.out { animation: toastOut .2s ease-in forwards; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 16px) scale(.92); } }
  @keyframes toastOut { to { opacity: 0; transform: translate(-50%, 10px); } }
  #offline { position: fixed; left: 0; right: 0; top: 0; background: #7a1512; color: #fff; font-weight: 800; font-size: 13px; text-align: center; padding: 6px; z-index: 950; display: none; }
  #offline.on { display: block; animation: dropIn .3s ease-out; }
  @keyframes dropIn { from { transform: translateY(-100%); } }
  #pop { position: fixed; inset: 0; z-index: 790; display: none; align-items: center; justify-content: center; padding: 20px; pointer-events: none; text-align: center; }
  #pop.on { display: flex; animation: fadeIn .14s; }
  #pop.out { animation: fadeOut .28s forwards; }
  #pop > div { width: 100%; max-width: 400px; padding: 22px 18px 20px; border-radius: 8px; animation: popBig .42s cubic-bezier(.2, 1.5, .4, 1) backwards; }
  #pop b { display: block; font: 400 min(64px, 16vw)/1.05 var(--display); letter-spacing: .04em; }
  #pop span { display: block; margin-top: 8px; font-weight: 800; font-size: 17px; line-height: 1.3; }
  #pop span:empty { display: none; }
  @keyframes popBig { from { opacity: 0; transform: scale(.5) rotate(-4deg); } }
  #pop.in { background: radial-gradient(circle at 50% 50%, #f7c94855, #000000c0 70%); }
  #pop.in > div { color: #231700; background: linear-gradient(#ffe27a, #f2b01e); box-shadow: 0 0 0 5px #fff, 0 0 60px #ffd24a, 0 20px 50px #000c; }
  #pop.slow { background: #000000b8; }
  #pop.slow > div { color: #fff; background: linear-gradient(#3a4466, #1c2340); box-shadow: 0 0 0 4px #7f8bb8, 0 20px 50px #000c; }
  #pop.round { background: #020617cc; }
  #pop.round > div { color: #fff; background: linear-gradient(#1a2ee6, #060ce9 45%, #050ab4); box-shadow: 0 0 0 4px #000, 0 0 0 6px #6b7fff, 0 20px 50px #000c; }
  #pop.round b { color: #fff; text-shadow: 4px 4px 0 #000; }
  #pop.good > div { color: #06301f; background: linear-gradient(#4fe3a8, #22a66f); box-shadow: 0 0 0 5px #fff, 0 20px 50px #000c; }
  #pop.bad > div { color: #fff; background: linear-gradient(#ff5a50, #c41410); box-shadow: 0 0 0 5px #fff, 0 20px 50px #000c; }
</style>
</head>
<body>

<section class="view on" id="join">
  <div class="j-wrap">
    <div class="j-logo"><b data-title></b></div>
    <div id="deskTv">
      <p>Is this the computer plugged into the TV?</p>
      <a class="tvbtn" href="/tv">SHOW THE GAME BOARD HERE</a>
      <span>OR JOIN AS A PLAYER</span>
    </div>
    <form id="joinForm" class="j-card" autocomplete="off">
      <label for="code"><span>ROOM CODE</span><span>4 letters, on the TV</span></label>
      <input id="code" maxlength="4" placeholder="••••" autocapitalize="characters" autocorrect="off" spellcheck="false">
      <label for="name"><span>YOUR NAME</span><span id="nameLeft">12</span></label>
      <input id="name" maxlength="12" placeholder="Type your name" autocapitalize="characters" autocorrect="off" spellcheck="false">
      <button class="j-play" id="playBtn">PLAY</button>
      <p id="joinErr"></p>
      <p id="joinWait"></p>
    </form>
    <p class="fine">Tip: scan the code on the TV to skip the typing.<span class="tvhint"><br>Setting up the TV? <a href="/tv">Open the game board</a> on the computer connected to it.</span></p>
    <p class="ver" id="ver"></p>
  </div>
</section>

<section class="view" id="lobby"></section>

<section class="view" id="play">
  <div class="scores" id="pScores"></div>
  <div id="pStatus"></div>
  <div id="pMain"></div>
</section>

<section class="view" id="host"></section>

<div id="pop"><div><b></b><span></span></div></div>
<div id="toast"></div>
<div id="offline">Reconnecting…</div>

<script src="/common.js"></script>
<script src="/editor.js"></script>
<script>
(function () {
  'use strict';
  var F = window.Game, $ = F.$, esc = F.esc, money = F.money, sfx = F.sfx;
  var sess = F.store.get('jep.me', null);      // { code, token, name }
  var S = null, me = null, conn = null, hello = null, lastSeq = null;
  var triedRejoinByName = false, typed = false;
  var waiting = false, waited = false, waitTimer = null, online = false, LIVE_MS = 15 * 60 * 1000;
  var menuOpen = false, editorOpen = false, lockedUntil = 0, drafts = {};
  function waitForGame() {
    waiting = true; waited = true;
    var bar = $('#offline');
    bar.textContent = 'Hang tight. Bringing your game back…';
    bar.classList.add('on');
    clearTimeout(waitTimer);
    waitTimer = setTimeout(function () { if (waiting && conn && hello) conn.send(hello); }, 2000);
  }
  function stopWaiting() {
    if (!waiting) return;
    waiting = false; clearTimeout(waitTimer);
    var bar = $('#offline');
    bar.classList.remove('on'); bar.textContent = 'Reconnecting…';
  }

  document.querySelectorAll('[data-title]').forEach(function (n) { n.textContent = F.TITLE; });
  document.title = F.TITLE;
  $('#ver').textContent = 'VERSION ' + F.VERSION;
  F.pressFx();

  function show(id) {
    document.querySelectorAll('.view').forEach(function (n) { n.classList.toggle('on', n.id === id); });
    document.querySelector('meta[name=theme-color]').setAttribute('content', id === 'join' ? '#0a1f9c' : '#030726');
  }
  var toastTimer, toastOut;
  function toast(msg) {
    var t = $('#toast');
    clearTimeout(toastTimer); clearTimeout(toastOut);
    t.textContent = msg; t.classList.remove('out');
    if (t.classList.contains('on')) F.bump(t, 1.06); else t.classList.add('on');
    toastTimer = setTimeout(function () { t.classList.add('out'); toastOut = setTimeout(function () { t.classList.remove('on', 'out'); }, 200); }, 2600);
  }
  var popTimer, popOut;
  function pop(kind, title, sub, ms) {
    var el = $('#pop');
    clearTimeout(popTimer); clearTimeout(popOut);
    el.className = ''; void el.offsetWidth;
    el.querySelector('b').textContent = title;
    el.querySelector('span').textContent = sub || '';
    el.className = 'on ' + kind;
    popTimer = setTimeout(function () { el.classList.add('out'); popOut = setTimeout(function () { el.className = ''; }, 280); }, ms || 1300);
  }
  function hidePop() { clearTimeout(popTimer); clearTimeout(popOut); $('#pop').className = ''; }
  function buzzPhone(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* ignore */ } }
  function send(m) { if (!conn || !conn.send(m)) toast('Reconnecting… try again in a second'); }
  function H(a, extra) { send(Object.assign({ t: 'h', a: a }, extra || {})); }
  function player(id) { return (S && S.players.filter(function (p) { return p.id === id; })[0]) || null; }
  function pname(id) { var p = player(id); return p ? p.name : '?'; }

  function fitViewport() {
    var vv = window.visualViewport;
    document.documentElement.style.setProperty('--vh', (vv ? vv.height : innerHeight) + 'px');
  }
  if (window.visualViewport) { visualViewport.addEventListener('resize', fitViewport); visualViewport.addEventListener('scroll', fitViewport); }
  addEventListener('resize', fitViewport); fitViewport();

  /* ------------------------------------------------------------- join */
  var codeIn = $('#code'), nameIn = $('#name');
  var qCode = (new URLSearchParams(location.search).get('code') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  codeIn.value = qCode || '';
  if (qCode) $('#join').classList.add('hascode');
  nameIn.value = F.store.get('jep.name', '');
  function joinReady() {
    codeIn.value = codeIn.value.toUpperCase().replace(/[^A-Z]/g, '');
    $('#nameLeft').textContent = (12 - nameIn.value.length) + ' left';
    var ok = codeIn.value.length === 4 && nameIn.value.trim().length > 0;
    $('#playBtn').classList.toggle('ready', ok);
    if (ok && /^Enter the/.test($('#joinErr').textContent)) $('#joinErr').textContent = '';
    return ok;
  }
  codeIn.addEventListener('input', joinReady); nameIn.addEventListener('input', joinReady); joinReady();
  $('#joinForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!joinReady()) { $('#joinErr').textContent = 'Enter the 4-letter room code and your name.'; F.shake($('#joinForm')); return; }
    $('#joinErr').textContent = '';
    typed = true;
    F.store.set('jep.name', nameIn.value.trim().toUpperCase());
    joinBusy(true);
    var nm = nameIn.value.trim();
    if (sess && sess.token && sess.code === codeIn.value && sess.name === nm.toUpperCase()) { triedRejoinByName = false; start({ t: 'rejoin', code: sess.code, token: sess.token }); }
    else start({ t: 'join', code: codeIn.value, name: nm });
  });
  var busyTimer;
  function joinBusy(on) {
    var b = $('#playBtn');
    clearTimeout(busyTimer);
    b.classList.toggle('busy', on);
    b.textContent = on ? 'JOINING…' : 'PLAY';
    $('#joinWait').textContent = '';
    if (on) busyTimer = setTimeout(function () { $('#joinWait').textContent = 'Waking the game up. The first join of the night can take up to a minute.'; }, 3500);
  }
  function start(h) {
    hello = h; lastSeq = null;
    if (!conn) {
      conn = F.connect({
        hello: function () { return hello; },
        onMessage: onMessage,
        onStatus: function (ok) { online = ok; $('#offline').classList.toggle('on', !ok && !!S); }
      });
    } else if (!conn.send(h)) { joinBusy(false); $('#joinErr').textContent = 'Connecting… tap PLAY again in a moment.'; }
  }
  function backToJoin(msg) {
    stopWaiting();
    S = null; me = null; hello = null; sess = null;
    F.store.del('jep.me');
    closeMenu(true); hidePop(); joinBusy(false);
    show('join');
    $('#joinErr').textContent = msg || '';
    if (msg) F.shake($('#joinForm'));
  }

  function onMessage(m) {
    if (m.t === 'joined') {
      joinBusy(false); stopWaiting(); waited = false;
      sess = { code: m.code, token: m.token, name: (sess && sess.name) || nameIn.value.trim().toUpperCase(), at: Date.now() };
      F.store.set('jep.me', sess);
      hello = { t: 'rejoin', code: m.code, token: m.token };
      triedRejoinByName = false;
      F.stayAwake();
    } else if (m.t === 'early') {
      // Buzzed before the host opened the buzzers: locked out for a moment.
      lockedUntil = performance.now() + (m.until || 250);
      sfx.early(); buzzPhone([40, 40, 40]);
      var b = $('#buzzBtn'); if (b) { b.classList.add('locked'); b.textContent = 'TOO EARLY'; setTimeout(function () { if (S) render([]); }, (m.until || 250) + 20); }
    } else if (m.t === 'error') {
      var ours = sess && hello && (hello.t === 'rejoin' || (hello.t === 'join' && String(hello.code).toUpperCase() === sess.code));
      if (m.code === 'noroom' && m.wait && ours && (S || Date.now() - (sess.at || 0) < LIVE_MS)) {
        waitForGame();
      } else if (m.code === 'noroom' && hello && hello.t === 'rejoin' && sess && sess.name && !triedRejoinByName) {
        triedRejoinByName = true;
        hello = { t: 'join', code: sess.code, name: sess.name };
        conn.send(hello);
      } else if (!S || m.code === 'noroom') {
        if (waited && sess && m.code === 'noroom') {
          var keep = sess;
          backToJoin('Your game hasn’t come back yet. Once the TV shows it again, tap PLAY to jump back in.');
          sess = keep; F.store.set('jep.me', keep);
          codeIn.value = keep.code; if (keep.name) nameIn.value = keep.name; joinReady(); waited = false;
        } else backToJoin(typed || S ? m.msg : '');
      } else toast(m.msg);
    } else if (m.t === 'left') {
      if (conn && m.replaced) { conn.stop(); conn = null; }
      backToJoin(m.kicked ? 'The host removed you from the game.' : m.replaced ? 'This game was opened on another device or tab.' : '');
    } else if (m.t === 'state') {
      if ($('#playBtn').classList.contains('busy')) joinBusy(false);
      if (sess && Date.now() - (sess.at || 0) > 20000) { sess.at = Date.now(); F.store.set('jep.me', sess); }
      var list = m.s.fx || [], fresh = [];
      if (lastSeq === null) lastSeq = list.length ? list[list.length - 1].seq : 0;
      else { fresh = list.filter(function (e) { return e.seq > lastSeq; }); if (fresh.length) lastSeq = fresh[fresh.length - 1].seq; }
      S = m.s; me = S.me;
      render(fresh);
    }
  }
  if (sess && sess.code && sess.token && (!qCode || qCode === sess.code)) start({ t: 'rejoin', code: sess.code, token: sess.token });
  setInterval(function () { if (S && sess && online) { sess.at = Date.now(); F.store.set('jep.me', sess); } }, 60000);

  /* ----------------------------------------------------------- render */
  var lastPhase = null;
  function render(fresh) {
    var has = {};
    fresh.forEach(function (e) { has[e.type] = e; });
    if (has.restored) toast('We’re back. Right where we left off.');
    if (S.phase === 'lobby') { closeMenu(true); hidePop(); renderLobby(); show('lobby'); lastPhase = 'lobby'; return; }
    if (me.isHost) { show('host'); renderHost(has); }
    else { show('play'); renderPlay(has); }
    if (menuOpen) renderMenu();
    lastPhase = S.phase;
  }

  /* ------------------------------------------------------------ lobby */
  var lobbyDirty = false;
  function renderLobby() {
    var h = '<div class="bar"><span>ROOM <b>' + esc(S.code) + '</b></span><span>' + esc(me.name) + (me.isHost ? ' · HOST' : me.playing ? ' · PLAYER' : '') + '</span></div><div class="wrap">';
    h += '<div class="card' + (me.playing ? ' mine' : '') + '" data-key="players"><h3><span>PLAYERS</span><small>' + S.players.length + ' OF ' + S.maxPlayers + '</small></h3><div class="who">' +
      (S.players.length ? S.players.map(function (p, i) { return '<span class="' + (p.id === me.id ? 'me' : '') + (p.on ? '' : ' off') + '"><i>' + (i + 1) + '</i>' + esc(p.name) + '</span>'; }).join('') : '<em>Nobody yet</em>') + '</div>';
    if (!me.playing && !me.isHost) h += '<button class="btn gold" data-a="play">Take a podium</button>';
    else if (me.playing) h += '<p class="note">You’re in. Your phone is your buzzer.</p>';
    h += '</div>';
    h += '<div class="card' + (me.isHost ? ' mine' : '') + '" data-key="host"><h3><span>HOST</span></h3>';
    if (S.host) h += '<div class="who"><span class="' + (S.host.id === me.id ? 'me' : '') + (S.host.on ? '' : ' off') + '">' + esc(S.host.name) + '</span></div>';
    else h += '<p class="note" style="margin-top:0">The host reads the clues from their phone and judges the answers.</p>';
    if (!me.isHost && (!S.host || !S.host.on)) h += '<button class="btn" data-a="behost">Be the host</button>';
    else if (me.isHost) h += '<button class="btn ghost sm" data-a="unhost">I’d rather play</button>';
    h += '</div>';
    if (me.isHost) {
      var st = S.settings;
      h += '<div class="card" data-key="setup"><h3><span>SETUP</span></h3>';
      h += '<div class="toggle"><div>Daily Doubles<small>One in round one, two in Double</small></div><button class="sw ' + (st.dd ? 'on' : '') + '" data-a="dd"></button></div>';
      h += '<div class="toggle"><div>Final round<small>Wager, then everyone answers in writing</small></div><button class="sw ' + (st.final ? 'on' : '') + '" data-a="final"></button></div>';
      h += '<div class="toggle"><div>Buzz window<small>How long the buzzers stay open before the clue is dead</small></div></div><div class="seg" data-key="secs">' +
        S.buzzChoices.map(function (v) { return '<button data-a="secs" data-v="' + v + '" class="' + (st.buzzSecs === v ? 'on' : '') + '">' + (v ? v + 's' : 'Host calls it') + '</button>'; }).join('') + '</div>';
      h += '<div class="toggle" style="margin-top:8px"><div>Use my own clues first<small>' + (S.customCount ? S.customCount + ' categories, ' + S.customFinals + ' Final clue' + (S.customFinals === 1 ? '' : 's') : 'None written yet') + '</small></div><button class="sw ' + (st.useCustom ? 'on' : '') + '" data-a="useCustom"></button></div>';
      h += '<button class="btn ghost sm" data-a="editor">Write clues</button></div>';
      h += '<div class="card" data-key="packs"><h3><span>CLUE PACKS</span><small>' + st.packs.length + ' ON</small></h3>';
      S.packs.forEach(function (pk) {
        var on = st.packs.indexOf(pk.id) >= 0;
        h += '<div class="toggle"><div>' + esc(pk.name) + (pk.adult ? '<span class="tag">18+</span>' : '') + '<small>' + esc(pk.blurb) + ' · ' + pk.count + ' categories</small></div><button class="sw ' + (on ? 'on' : '') + '" data-a="pack" data-id="' + pk.id + '"></button></div>';
      });
      h += '</div>';
      h += '<div class="card" data-key="manage"><h3><span>PLAYERS</span><small>TAP TO REMOVE</small></h3><div class="who">' +
        (S.players.length ? S.players.map(function (p) { return '<span>' + esc(p.name) + '<button data-a="kick" data-id="' + p.id + '">×</button></span>'; }).join('') : '<em>Nobody yet</em>') + '</div></div>';
      var ready = S.players.length > 0;
      h += '<button class="btn gold big' + (ready ? ' glow' : '') + '" data-a="start"' + (ready ? '' : ' disabled') + '>Start the game</button>';
      h += '<p class="note">' + (ready ? 'A game is two rounds of 30 clues' + (st.final ? ' and a Final.' : '.') : 'Need at least one player.') + '</p>';
    } else h += '<p class="note">' + (S.host ? 'Waiting for ' + esc(S.host.name) + ' to start the game.' : 'Waiting for a host.') + '</p>';
    h += '<a class="link" href="#" data-a="leave">Leave the game</a></div>';
    F.morph($('#lobby'), h);
  }
  $('#lobby').addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b) return;
    e.preventDefault();
    var a = b.dataset.a;
    if (a === 'play') send({ t: 'play', on: true });
    else if (a === 'behost') send({ t: 'host', on: true });
    else if (a === 'unhost') send({ t: 'host', on: false });
    else if (a === 'leave') { if (confirm('Leave this game?')) send({ t: 'leave' }); }
    else if (a === 'start') H('start');
    else if (a === 'dd') H('settings', { dd: !S.settings.dd });
    else if (a === 'final') H('settings', { final: !S.settings.final });
    else if (a === 'useCustom') H('settings', { useCustom: !S.settings.useCustom });
    else if (a === 'secs') H('settings', { buzzSecs: Number(b.dataset.v) });
    else if (a === 'pack') { var packs = S.settings.packs.slice(); var i = packs.indexOf(b.dataset.id); if (i >= 0) packs.splice(i, 1); else packs.push(b.dataset.id); H('settings', { packs: packs }); }
    else if (a === 'kick') { var p = player(b.dataset.id); if (p && confirm('Remove ' + p.name + ' from the game?')) H('kick', { id: p.id }); }
    else if (a === 'editor') openEditor();
  });
  function openEditor() {
    editorOpen = true;
    F.openEditor({ custom: F.savedCustom(), onChange: function (c) { H('custom', { custom: c }); }, onClose: function () { editorOpen = false; } });
  }

  /* ------------------------------------------------------------- play */
  function scoreStrip(root) {
    var g = S.game;
    F.morph(root, S.players.map(function (p) {
      var sc = g.scores[p.id] || 0;
      return '<div class="sc' + (p.id === me.id ? ' me' : '') + (g.control === p.id && S.phase === 'pick' ? ' ctl' : '') + (g.buzzed === p.id ? ' buzz' : '') + '" data-key="s' + p.id + '"><div class="n">' + esc(p.name) + '</div><span class="s' + (sc < 0 ? ' neg' : '') + '" data-live id="ss' + p.id + '"></span></div>';
    }).join(''));
    S.players.forEach(function (p) { F.countTo($('#ss' + p.id), g.scores[p.id] || 0, 400); });
  }
  function boardHtml(g, canPick, hv) {
    var vals = g.board;
    return '<div class="pboard' + (canPick ? '' : ' ro') + '">' + vals.map(function (c, ci) {
      return '<div class="pcat"><h4>' + esc(c.name) + '</h4><div class="vals">' + c.clues.map(function (q, ri) {
        var dd = hv && hv.board && hv.board[ci].clues[ri].dd;
        return '<button data-a="pick" data-cat="' + ci + '" data-row="' + ri + '"' + (q.done || !canPick ? ' disabled' : '') + (dd ? ' class="dd"' : '') + '>' + (q.done ? '' : '$' + (q.value >= 1000 ? (q.value / 1000) + 'K' : q.value)) + '</button>';
      }).join('') + '</div></div>';
    }).join('') + '</div>';
  }
  function renderPlay(has) {
    var g = S.game, ph = S.phase;
    scoreStrip($('#pScores'));
    var st = $('#pStatus'), text = '', cls = '';
    var main = '';
    var sc = me.score || 0;
    var scoreBlock = '<div class="me-score" data-key="mescore"><small>' + esc(me.name) + '</small><b class="' + (sc < 0 ? 'neg' : '') + '" data-live id="myScore"></b></div>';
    if (!me.playing) {
      text = 'You’re watching';
      main = '<p class="note">The podiums were full when you joined. You can watch along here.</p>';
    } else if (ph === 'pick') {
      if (me.control) { text = 'Your pick. Choose a clue.'; cls = 'you'; main = scoreBlock + boardHtml(g, true); }

        (f.step === 0 ? '<button class="btn gold big" data-a="fNext">Show their answer on the TV</button>'
          : f.step === 1 ? '<div class="row"><button class="btn green big" data-a="fRight">Correct</button><button class="btn red big" data-a="fWrong">Wrong</button></div>'
          : '<button class="btn gold big" data-a="fNext">' + (f.idx + 1 >= f.order.length ? 'Show the final scores' : 'Next: ' + esc(pname(f.order[f.idx + 1]))) + '</button>') + '</div>';
      h += '<div class="card" data-key="forder">' + f.order.map(function (id, i) {
        var row = f.shown[i];
        return '<div class="frow' + (i === f.idx ? ' cur' : '') + (row && row.correct != null ? (row.correct ? ' right' : ' wrong') : '') + '" style="margin-bottom:6px"><span>' + esc(pname(id)) + '<small>' + (fh.answers && fh.answers[id] ? esc(fh.answers[id]) : 'No answer') + ' · wagered ' + money(fh.wagers ? fh.wagers[id] : 0) + '</small></span><em>' + money(g.scores[id] || 0) + '</em></div>';
      }).join('') + '</div>';
    }
    return h;
  }
  function hostLights(g, ph) {
    var el = $('#hLights');
    if (!el || ph !== 'buzz' || g.windowLeft == null) { clearInterval(hLightTimer); hLightTimer = null; return; }
    hLightEnd = performance.now() + g.windowLeft; hLightTotal = (S.settings.buzzSecs || 5) * 1000;
    if (!hLightTimer) hLightTimer = setInterval(paintHL, 100);
    paintHL();
  }
  // The answer clock: 5 seconds from the buzz (or from the wager on a Daily Double). The host still decides.
  var aEnd = null, aTimer = null, aLast = null;
  function answerClock(g, ph) {
    var el = $('#aClock');
    if (!el || (ph !== 'answer' && ph !== 'ddAnswer')) { aEnd = null; if (aTimer) { clearInterval(aTimer); aTimer = null; } aLast = null; return; }
    if (g.answerLeft != null) aEnd = performance.now() + g.answerLeft;
    if (!aTimer) aTimer = setInterval(paintA, 100);
    paintA();
  }
  function paintA() {
    var el = $('#aClock'); if (!el || aEnd == null) return;
    var sec = Math.max(0, Math.ceil((aEnd - performance.now()) / 1000));
    el.textContent = sec; el.classList.toggle('hot', sec <= 2);
    if (sec !== aLast) { if (aLast != null && sec === 0) buzzPhone([60, 40, 60]); aLast = sec; }
  }
  function paintHL() {
    var n = Math.ceil(Math.max(0, (hLightEnd - performance.now()) / hLightTotal) * 5);
    document.querySelectorAll('#hLights i').forEach(function (b, i) { b.classList.toggle('lit', i < n); });
  }
  $('#host').addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.dataset.a, g = S.game;
    if (a === 'pick') H('pick', { cat: Number(b.dataset.cat), row: Number(b.dataset.row) });
    else if (a === 'open') H('open');
    else if (a === 'close') H('close');
    else if (a === 'mbuzz') H('manualBuzz', { id: b.dataset.id });
    else if (a === 'right') H('right');
    else if (a === 'wrong') H('wrong');
    else if (a === 'clearBuzz') H('clearBuzz');
    else if (a === 'skip') { if (confirm('Take this clue off the board without playing it?')) H('skip'); }
    else if (a === 'continue') H('continue');
    else if (a === 'hwager') { var w = $('#hWager'), v = Math.round(Number(w.value)); if (!w.value || v < g.dd.min || v > g.dd.max) { toast('Between ' + money(g.dd.min) + ' and ' + money(g.dd.max)); return; } drafts.hw = null; H('ddWager', { amount: v }); }
    else if (a === 'fClue') H('fClue');
    else if (a === 'fwset') { var inp = document.querySelector('[data-fw="' + b.dataset.id + '"]'), fv = Math.round(Number(inp && inp.value)); if (!inp || inp.value === '' || fv < 0 || fv > Number(inp.max)) { toast('Between $0 and ' + money(Number(inp ? inp.max : 0))); return; } H('fWager', { id: b.dataset.id, amount: fv }); }
    else if (a === 'fStop') H('fStop');
    else if (a === 'fNext') H('fNext');
    else if (a === 'fRight') H('fRight');
    else if (a === 'fWrong') H('fWrong');
    else if (a === 'fSkip') { if (confirm('Skip Final? The scores as they stand decide the game.')) H('fSkip'); }
    else if (a === 'undo') H('undo');
    else if (a === 'endGame') H('endGame');
    else if (a === 'menu') openMenu();
  });
  $('#host').addEventListener('input', function (e) { if (e.target.id === 'hWager') drafts.hw = e.target.value; });
  $('#host').addEventListener('keydown', function (e) { if (e.target.id === 'hWager' && e.key === 'Enter') { e.preventDefault(); var b = document.querySelector('[data-a=hwager]'); if (b) b.click(); } });

  /* the host menu: fix a score, hand over the board, end the round, remove a player, end the game */
  function openMenu() {
    if (menuOpen) return;
    menuOpen = true;
    var m = document.createElement('div');
    m.className = 'menu-back'; m.id = 'menu';
    document.body.appendChild(m);
    m.addEventListener('click', function (e) {
      var b = e.target.closest('[data-a]'); if (!b) return;
      var a = b.dataset.a, g = S.game;
      if (a === 'close') closeMenu();
      else if (a === 'adj') H('adjust', { id: b.dataset.id, delta: Number(b.dataset.d) });
      else if (a === 'control') { H('control', { id: b.dataset.id }); closeMenu(); }
      else if (a === 'secs') H('settings', { buzzSecs: Number(b.dataset.v) });
      else if (a === 'kick') { var p = player(b.dataset.id); if (p && confirm('Remove ' + p.name + ' from the game?')) H('kick', { id: p.id }); }
      else if (a === 'endRound') { if (confirm((g.round === 1 ? 'Clear the rest of the board and start Double?' : 'Clear the rest of the board and go to Final?'))) { H('endRound'); closeMenu(); } }
      else if (a === 'endGame') { if (confirm('End this game and go back to the lobby?')) { H('endGame'); closeMenu(); } }
      else if (a === 'leave') { if (confirm('Leave the game? Someone else will need to host.')) send({ t: 'leave' }); }
    });
    renderMenu();
  }
  function renderMenu() {
    var m = $('#menu'); if (!m || !S.game) return;
    var g = S.game, st = S.settings;
    var h = '<div class="menu"><div class="bar" style="border-radius:12px"><b>MENU</b><button class="btn sm" data-a="close" style="width:auto">Close</button></div>';
    h += '<div class="card" data-key="m-scores"><h3><span>FIX A SCORE</span></h3>' + S.players.map(function (p) {
      return '<div class="adj" data-key="a' + p.id + '"><span>' + esc(p.name) + '</span>' + [-1000, -200].map(function (d) { return '<button data-a="adj" data-id="' + p.id + '" data-d="' + d + '">' + (d / 1000 >= 1 || d / 1000 <= -1 ? (d / 1000) + 'K' : d) + '</button>'; }).join('') +
        '<b>' + money(g.scores[p.id] || 0) + '</b>' + [200, 1000].map(function (d) { return '<button data-a="adj" data-id="' + p.id + '" data-d="' + d + '">+' + (d >= 1000 ? (d / 1000) + 'K' : d) + '</button>'; }).join('') + '</div>';
    }).join('') + '</div>';
    if (S.phase === 'pick') h += '<div class="card" data-key="m-ctl"><h3><span>GIVE THE BOARD TO</span></h3><div class="who">' + S.players.map(function (p) { return '<span><button data-a="control" data-id="' + p.id + '" style="width:auto;border-radius:999px;padding:0 10px;background:' + (g.control === p.id ? '#f5c542;color:#231700' : '#2a45c9') + '">' + esc(p.name) + '</button></span>'; }).join('') + '</div></div>';
    h += '<div class="card" data-key="m-secs"><h3><span>BUZZ WINDOW</span></h3><div class="seg">' + S.buzzChoices.map(function (v) { return '<button data-a="secs" data-v="' + v + '" class="' + (st.buzzSecs === v ? 'on' : '') + '">' + (v ? v + 's' : 'Host calls it') + '</button>'; }).join('') + '</div></div>';
    h += '<div class="card" data-key="m-players"><h3><span>REMOVE A PLAYER</span></h3><div class="who">' + S.players.map(function (p) { return '<span>' + esc(p.name) + '<button data-a="kick" data-id="' + p.id + '">×</button></span>'; }).join('') + '</div></div>';
    if (g.board && (S.phase === 'pick' || S.phase === 'reveal')) h += '<button class="btn ghost" data-a="endRound" style="margin-bottom:10px">' + (g.round === 1 ? 'End round one now' : 'End Double now') + '</button>';
    h += '<button class="btn red" data-a="endGame">End the game</button><a class="link" href="#" data-a="leave">Leave the game</a></div>';
    F.morph(m, h);
  }
  function closeMenu(now) {
    menuOpen = false;
    var m = $('#menu'); if (!m) return;
    if (now || !F.motionOK()) { m.remove(); return; }
    m.classList.add('out'); setTimeout(function () { m.remove(); }, 200);
  }
})();
</script>
</body>
</html>
